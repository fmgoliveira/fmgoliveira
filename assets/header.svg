<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Francisco Oliveira, software developer">
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".1"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="mk"><rect width="900" height="270" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="900" height="270" rx="16"/></clipPath></defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:24px;fill:#d4d4d4}
  .hello{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:13px;fill:#737373;letter-spacing:.5px}
  .name{font-size:58px;font-weight:700;letter-spacing:-2px;fill:#fff}
  .meta{font-size:13px;fill:#737373;letter-spacing:.3px}
  .in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .r1{transform-origin:745px 135px;animation:spin 50s linear infinite} .r2{transform-origin:745px 135px;animation:spin 32s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 3s ease-in-out infinite} @keyframes pulse{50%{opacity:.3}}
@keyframes clip0{0%,0.00%{width:0}1.00%{width:0;animation-timing-function:steps(31,end)}10.50%,29.83%{width:446.4px}33.32%,100%{width:0}}
@keyframes cur0{0%,0.00%{transform:translateX(0);opacity:0}0.99%{transform:translateX(0);opacity:1;animation-timing-function:steps(31,end)}10.50%,29.83%{transform:translateX(446.4px);opacity:1}31.03%,100%{transform:translateX(446.4px);opacity:0}}
.c0{animation:clip0 15.0s infinite} .k0{animation:cur0 15.0s infinite}
@keyframes clip1{0%,33.33%{width:0}34.33%{width:0;animation-timing-function:steps(34,end)}43.83%,63.17%{width:489.6px}66.66%,100%{width:0}}
@keyframes cur1{0%,33.33%{transform:translateX(0);opacity:0}34.32%{transform:translateX(0);opacity:1;animation-timing-function:steps(34,end)}43.83%,63.17%{transform:translateX(489.6px);opacity:1}64.37%,100%{transform:translateX(489.6px);opacity:0}}
.c1{animation:clip1 15.0s infinite} .k1{animation:cur1 15.0s infinite}
@keyframes clip2{0%,66.67%{width:0}67.67%{width:0;animation-timing-function:steps(34,end)}77.17%,96.50%{width:489.6px}99.99%,100%{width:0}}
@keyframes cur2{0%,66.67%{transform:translateX(0);opacity:0}67.66%{transform:translateX(0);opacity:1;animation-timing-function:steps(34,end)}77.17%,96.50%{transform:translateX(489.6px);opacity:1}97.70%,100%{transform:translateX(489.6px);opacity:0}}
.c2{animation:clip2 15.0s infinite} .k2{animation:cur2 15.0s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.c0{width:446.4px}.k0,.k1,.k2{display:none}}
</style>
<g clip-path="url(#card)">
  <rect width="900" height="270" fill="#0a0a0a"/>
  <g mask="url(#mk)"><rect width="900" height="270" fill="url(#dots)"/></g>
  <g fill="none" stroke="#fff">
    <g class="r1" stroke-opacity=".14" stroke-dasharray="2 8" stroke-linecap="round"><circle cx="745" cy="135" r="104"/><circle cx="849" cy="135" r="4" fill="#fff" stroke="none"/></g>
    <g class="r2" stroke-opacity=".2"><circle cx="745" cy="135" r="64"/><circle cx="745" cy="71" r="3" fill="#a3a3a3" stroke="none"/></g>
    <circle cx="745" cy="135" r="4" fill="#fff" stroke="none" class="pulse"/>
  </g>
  <text class="hello in" x="64" y="84" style="animation-delay:.1s">// hello, world — i'm</text>
  <text class="name in" x="62" y="148" style="animation-delay:.3s">Francisco Oliveira</text>
  <clipPath id="tc0"><rect class="c0" x="0" y="-26" height="40" width="0"/></clipPath>
<g transform="translate(64 196)"><g clip-path="url(#tc0)"><text class="mono" x="0" y="0" textLength="446.4" lengthAdjust="spacingAndGlyphs">Software developer &amp; CS student</text></g>
<g class="k0"><rect class="blink" x="3" y="-22" width="2.5" height="28" fill="#fff"/></g></g><clipPath id="tc1"><rect class="c1" x="0" y="-26" height="40" width="0"/></clipPath>
<g transform="translate(64 196)"><g clip-path="url(#tc1)"><text class="mono" x="0" y="0" textLength="489.6" lengthAdjust="spacingAndGlyphs">Building Velo, Voult &amp; Sinformania</text></g>
<g class="k1"><rect class="blink" x="3" y="-22" width="2.5" height="28" fill="#fff"/></g></g><clipPath id="tc2"><rect class="c2" x="0" y="-26" height="40" width="0"/></clipPath>
<g transform="translate(64 196)"><g clip-path="url(#tc2)"><text class="mono" x="0" y="0" textLength="489.6" lengthAdjust="spacingAndGlyphs">VP of n.inf  /  NOVA FCT, Portugal</text></g>
<g class="k2"><rect class="blink" x="3" y="-22" width="2.5" height="28" fill="#fff"/></g></g>
  <text class="meta in" x="64" y="236" style="animation-delay:.9s">Portugal  ·  Computer Science @ NOVA FCT  ·  TypeScript, systems &amp; self-hosting</text>
</g>
<rect x=".5" y=".5" width="899" height="269" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>
